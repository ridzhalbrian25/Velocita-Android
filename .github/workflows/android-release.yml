name: Velocita Android CI & Sub-3MB Release Pipeline

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew

      - name: Run Domain Unit Tests
        run: ./gradlew testDebugUnitTest

      - name: Assemble Minified R8 Release APKs (Split per ABI)
        run: ./gradlew assembleRelease

      - name: Verify APK Size SLA (< 2.0 MB for arm64-v8a)
        run: |
          for apk in app/build/outputs/apk/release/*.apk; do
            size_bytes=$(stat -c%s "$apk")
            size_kb=$((size_bytes / 1024))
            echo "Built $apk: ${size_kb} KB"
            if [ "$size_bytes" -gt 2097152 ]; then
              echo "ERROR: $apk exceeds 2.0 MB KPI limit!"
              exit 1
            fi
          done

      - name: Upload Release APKs
        uses: actions/upload-artifact@v4
        with:
          name: Velocita-release-apks
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
